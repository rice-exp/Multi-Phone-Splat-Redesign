<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101c1e">
  <title>Rice Experiential Pixels Lab · Participant display</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="participant-body">
  <header class="participant-header"><a href="/">Rice Experiential Pixels Lab</a><span id="connection" class="pill">Connecting…</span><button id="fullscreen" class="button dark-button">Full screen</button></header>
  <main class="participant-main">
    <div class="eyebrow">SIMULATION</div>
    <h1 id="participant-title">Capture status</h1>
    <p id="participant-instruction">Stand in the marked area and wait for the operator.</p>
    <div class="participant-steps" aria-label="Capture stages">
      <section data-participant-stage="preparing"><span class="participant-number">01</span><div><h2>Preparing</h2></div><span class="stage-mark">○</span></section>
      <section data-participant-stage="capturing"><span class="participant-number">02</span><div><h2>Capturing</h2></div><strong id="participant-timer" class="participant-timer">—</strong></section>
      <section data-participant-stage="done"><span class="participant-number">03</span><div><h2>Complete</h2></div><span class="stage-mark">✓</span></section>
    </div>
    <div id="participant-alert" role="status" aria-live="polite"></div>
  </main>
  <footer class="participant-footer"><span id="participant-session">Waiting for a session</span></footer>
  <script type="module" src="/js/participant.js"></script>
</body>
</html>
